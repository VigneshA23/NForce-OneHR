spring:
  config:
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Override validate — Flyway owns the schema; ddl-auto: validate
      # fails on citext/timestamptz column types reported by Postgres metadata
      ddl-auto: none
  flyway:
    # This is a shared dev database that multiple feature branches migrate against
    # directly (see V40/V47 header comments). A branch's local migration folder can
    # therefore lag behind versions another branch already applied — that's expected,
    # not corruption, so don't fail validation over migrations we simply don't have
    # the file for locally.
    ignore-migration-patterns: "*:missing"

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5173,http://localhost:3000}
  base-url: ${APP_BASE_URL:http://localhost:5180}
  attendance:
    # Business timezone for punch timestamps and work-date attribution.
    # Deliberately explicit — the JVM default is UTC on Railway.
    zone: ${ATTENDANCE_ZONE:Asia/Kolkata}
    # Provisional shift rules pending PO confirmation.
    shift-start: "09:30"
    late-grace-minutes: 15
    half-day-max-hours: 4
    full-day-min-hours: 8
    regularization:
      # N-day lookback window for regularization requests. OPEN QUESTION FOR PRODUCT
      # OWNER: is 30 days correct, and should it vary by role/department? Kept
      # configurable here rather than hardcoded pending that decision.
      lookback-days: 30
resend:
  api-key: ${RESEND_API_KEY}
  from: OneHR <onboarding@nforceone.com>

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.nforce.onehr: DEBUG
    org.flywaydb: DEBUG
