spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # Override validate — Flyway owns the schema; ddl-auto: validate
      # fails on citext/timestamptz column types reported by Postgres metadata
      ddl-auto: none
  flyway:
    # This checkout's migration folder is missing V9-V11 (applied directly to the
    # shared Neon dev DB from elsewhere, never committed here) — tolerate that
    # drift instead of failing validation. Does not touch already-applied history.
    ignore-migration-patterns: "*:missing"

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:5173,http://localhost:3000}
  base-url: ${APP_BASE_URL:http://localhost:5180}

resend:
  api-key: ${RESEND_API_KEY}
  from: OneHR <onboarding@nforceone.com>

server:
  port: ${PORT:8081}

logging:
  level:
    com.nforce.onehr: DEBUG
    org.flywaydb: DEBUG
