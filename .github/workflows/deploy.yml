name: Deploy

on:
  push:
    branches: [main, dev]

# VERCEL_ORG_ID and VERCEL_PROJECT_ID replace .vercel/project.json in CI.
# Add both to GitHub repository secrets (alongside VERCEL_TOKEN):
#   VERCEL_ORG_ID  → Vercel dashboard → Team Settings → General → Team ID
#   VERCEL_PROJECT_ID → Vercel dashboard → Project Settings → General → Project ID

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # vercel pull links the runner to the correct project (writes project.json)
      # and downloads env vars for the target environment.

      - name: Pull Vercel environment info (production)
        if: github.ref_name == 'main'
        run: |
          vercel pull --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd frontend

      - name: Pull Vercel environment info (preview)
        if: github.ref_name == 'dev'
        run: |
          vercel pull --yes \
            --environment=preview \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd frontend

      # vercel deploy (without --prebuilt) sends source to Vercel and lets
      # their servers run the build. Avoids the local PATH issue where
      # `vercel build` invokes `vite build` as a raw shell command that cannot
      # find the binary in node_modules/.bin.

      # PRODUCTION: --prod automatically promotes the production domain.
      # --skip-domain exists to disable that; we omit it, so promotion is automatic.
      - name: Deploy to production
        if: github.ref_name == 'main'
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd frontend

      # PREVIEW: capture deployment URL from stdout, alias to stable QA link.
      - name: Deploy preview and alias to stable QA URL
        if: github.ref_name == 'dev'
        run: |
          DEPLOYMENT_URL=$(vercel deploy \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --cwd frontend)
          echo "Deployed to: $DEPLOYMENT_URL"
          vercel alias set "$DEPLOYMENT_URL" nforce-one-hr-git-dev-nforce-one.vercel.app \
            --token=${{ secrets.VERCEL_TOKEN }}
