name: Backend tests

# Runs the full backend test suite on every PR into main/dev so a regression is a failed check on
# the PR rather than something found in production (ONEHR-885). The suite is self-contained: it
# uses H2 and mocks, no database or secrets. To make a red run actually block merging, mark
# "Backend tests / mvn test" as a required status check in the branch protection rules for
# main and dev (GitHub Settings -> Branches); a workflow file alone can't do that.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [main, dev]
    paths:
      - "backend/**"

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run tests
        working-directory: backend
        run: mvn -B test

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
